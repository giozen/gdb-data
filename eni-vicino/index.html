<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trova il distributore Eni più vicino</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717}.w{max-width:760px;margin:auto;padding:18px 14px}h1{font-size:26px;margin:0 0 8px}.intro{color:#555;line-height:1.4}.btn{width:100%;border:0;border-radius:8px;background:#0758a8;color:#fff;padding:14px;font-size:17px;font-weight:700}.note,.src{font-size:12px;color:#777}.status{margin:12px 0}.results{display:grid;gap:9px}.card{border:1px solid #ddd;border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.addr{font-size:14px;color:#555;margin-top:3px}.dist{font-size:19px;font-weight:800;white-space:nowrap}.go{display:inline-block;margin-top:8px;color:#0758a8;font-size:13px;font-weight:700;text-decoration:none}#map{height:350px;margin-top:15px;border-radius:8px;display:none}</style></head><body><main class="w"><h1>Trova il distributore Eni più vicino a te</h1><p class="intro">Attiva la posizione per vedere i distributori Eni/Agip della provincia di Brescia più vicini.</p><button class="btn" id="b">Usa la mia posizione</button><p class="note">La posizione viene usata solo nel tuo browser e non viene salvata.</p><div class="status" id="status"></div><div class="results" id="r"></div><div id="map"></div><p class="src">Fonte: Osservaprezzi Carburanti MIMIT. Distanze in linea d’aria.</p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const stations=[];</script><script src="s1.js"></script><script src="s2.js"></script><script src="s3.js"></script><script src="s4.js"></script><script>
const b=document.querySelector('#b'),r=document.querySelector('#r'),st=document.querySelector('#status');let map;
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hav(a,o,c,d){let R=6371,x=(c-a)*Math.PI/180,y=(d-o)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function fmt(x){return x<1?Math.round(x*1000)+' m':(x<10?x.toFixed(1):Math.round(x))+' km'}
function show(lat,lon){let n=stations.map(s=>[...s,hav(lat,lon,s[3],s[4])]).sort((a,b)=>a[5]-b[5]).slice(0,5);r.innerHTML=n.map((s,i)=>'<div class="card"><div><div class="name">'+(i+1)+'. '+esc(s[0])+'</div><div class="addr">'+esc(s[1])+' · '+esc(s[2])+'</div><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+s[3]+','+s[4]+'">Indicazioni stradali →</a></div><div class="dist">'+fmt(s[5])+'</div></div>').join('');let e=document.querySelector('#map');e.style.display='block';if(map)map.remove();map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);let g=[L.circleMarker([lat,lon],{radius:8}).addTo(map).bindPopup('La tua posizione')];n.forEach((s,i)=>g.push(L.marker([s[3],s[4]]).addTo(map).bindPopup('<b>'+(i+1)+'. '+esc(s[0])+'</b><br>'+esc(s[1])+'<br>'+fmt(s[5]))));map.fitBounds(L.featureGroup(g).getBounds().pad(.2))}
b.onclick=()=>{st.textContent='';if(!window.isSecureContext){st.textContent='La geolocalizzazione richiede una pagina HTTPS.';return}if(!navigator.geolocation){st.textContent='Geolocalizzazione non supportata.';return}b.disabled=true;b.textContent='Cerco la tua posizione…';navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;b.textContent='Aggiorna la mia posizione';show(p.coords.latitude,p.coords.longitude)},e=>{b.disabled=false;b.textContent='Usa la mia posizione';st.textContent=e.code===1?'Consenti l’accesso alla posizione nelle impostazioni del browser.':'Non riesco a rilevare la posizione. Riprova.'},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})};
</script></body></html>
